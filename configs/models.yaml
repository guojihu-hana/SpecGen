# Model profiles. ${VAR} is read from the environment when the endpoint is used;
# "<...>" values are placeholders that must be filled before use.
#
# reasoning:   auto | field | inline   (run tools/probe_stream.py to find out)
#   field   - reasoning arrives in a separate delta field (reasoning_field, default auto-detected)
#   inline  - reasoning is inside `content` between think_tags
# tokenizer:   generic (tiktoken o200k_base) or a local Hugging Face tokenizer path
# api_key_env: environment variable holding the key; keys never go in this file
# modes:       extra request parameters per generation mode (main / spec), at the model
#              level or per endpoint (the endpoint wins)
# prefill:     how the endpoint continues a partial assistant message, used by spec
#              "prefill" prompts: {style: deepseek | vllm, base_url: optional}; without
#              it spec prompts fall back to "reprompt"
# options:     backend-specific settings (see docs)
# sampling:    spec_temperature (+ spec_temperature_step per spec of one trigger, capped
#              at spec_temperature_max) and spec_max_tokens apply to spec requests

GLM-5.1-FP8:
  tokenizer: generic
  reasoning: auto
  think_tags: ["<think>", "</think>"]
  sampling: {temperature: 0.6, top_p: 0.95, spec_temperature: 0.9, max_tokens: 32768}
  endpoints:
    selfhost:
      backend: vllm
      base_url: "${SPECGEN_GLM_SELFHOST_URL}"
      api_key_env: SPECGEN_GLM_SELFHOST_KEY
      model: "<served-model-name>"
    api:
      backend: api
      base_url: "${SPECGEN_GLM_API_URL}"
      api_key_env: SPECGEN_GLM_API_KEY
      model: "<api-model-name>"

# DeepSeek API (https://api-docs.deepseek.com): reasoning streams in `reasoning_content`;
# thinking mode ignores temperature, and its top_p is effective in [0.95, 1.0].
DeepSeek-V4-Pro:
  tokenizer: generic
  reasoning: field
  reasoning_field: reasoning_content
  think_tags: ["<think>", "</think>"]
  sampling: {temperature: 1.0, top_p: 0.95, spec_temperature: 1.0, max_tokens: 131072}
  endpoints:
    selfhost:
      backend: vllm
      base_url: "${SPECGEN_DEEPSEEK_SELFHOST_URL}"
      api_key_env: SPECGEN_DEEPSEEK_SELFHOST_KEY
      model: "<served-model-name>"
    api:
      backend: api
      base_url: https://api.deepseek.com
      api_key_env: SPECGEN_DEEPSEEK_API_KEY
      model: deepseek-v4-pro
      prefill: {style: deepseek, base_url: https://api.deepseek.com/beta}
      modes:
        main: {thinking: {type: enabled}, reasoning_effort: max}
        spec: {thinking: {type: disabled}}

DeepSeek-V4-Flash:
  tokenizer: generic
  reasoning: field
  reasoning_field: reasoning_content
  think_tags: ["<think>", "</think>"]
  sampling: {temperature: 1.0, top_p: 0.95, spec_temperature: 1.0, max_tokens: 131072}
  endpoints:
    selfhost:
      backend: vllm
      base_url: "${SPECGEN_DEEPSEEK_FLASH_SELFHOST_URL}"
      api_key_env: SPECGEN_DEEPSEEK_FLASH_SELFHOST_KEY
      model: "<served-model-name>"
    api:
      backend: api
      base_url: https://api.deepseek.com
      api_key_env: SPECGEN_DEEPSEEK_API_KEY
      model: deepseek-flash  # now served by DeepSeek-V4.1-Flash; "deepseek-v4-flash" is routed here too
      prefill: {style: deepseek, base_url: https://api.deepseek.com/beta}
      modes:
        main: {thinking: {type: enabled}, reasoning_effort: max}
        spec: {thinking: {type: disabled}}

