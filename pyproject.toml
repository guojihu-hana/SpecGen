[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specgen"
version = "0.1.0"
description = "Speculative LLM kernel generation with validation and profiling pipelines"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6",
    "httpx>=0.27",
    "ninja>=1.11",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
eval = ["torch>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
specgen = "specgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specgen.generation" = ["templates/*.txt"]
"specgen.analysis" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs an idle CUDA GPU (skipped when none is available)",
    "ncu: needs Nsight Compute (ncu) on PATH",
]
